<!DOCTYPE html>
<html lang="ar">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600&display=swap');

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			touch-action: none;
		}

		body {
			background: #FDF8F3;
			min-height: 100vh;
			overflow: hidden;
		}

		.wrap {
			font-family: 'Cairo', sans-serif;
			direction: rtl;
			height: 100vh;
			width: 100vw;
			overflow: hidden;
			user-select: none;
			position: relative;
			display: flex;
			flex-direction: column;
		}

		.top-section {
			padding: 1.5rem 1.25rem 0.5rem;
			pointer-events: none;
		}

		.topbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
		}

		.app-name {
			font-size: 18px;
			font-weight: 600;
			color: #7B4F2E;
		}

		.streak {
			font-size: 13px;
			color: #B07850;
			background: #F5E6D8;
			padding: 4px 12px;
			border-radius: 99px;
		}

		.confidence-track {
			background: #EDD9C8;
			border-radius: 99px;
			height: 6px;
			width: 100%;
			margin-top: 8px;
		}

		.confidence-fill {
			background: #C47B3A;
			border-radius: 99px;
			height: 6px;
			width: 38%;
			transition: width 0.3s;
		}

		.arena {
			position: relative;
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 10px;
			width: 100%;
		}

		.card {
			position: relative;
			width: 100%;
			height: 100%;
			max-width: 420px;
			max-height: min(70vh, 550px);
			border-radius: 28px;
			z-index: 10;
			overflow: hidden;
			cursor: grab;
			will-change: transform;
			background: #fff;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
			-webkit-mask-image: -webkit-radial-gradient(white, black);
		}

		.card-split-wrap {
			display: flex;
			height: 100%;
			width: 100%;
			position: relative;
		}

		.side {
			width: 50%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: clamp(50px, 12vh, 110px);
			background-size: cover;
			background-position: center;
		}

		.card-gradient-mid {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(to right, rgba(255, 255, 255, 0) 48%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 52%);
			z-index: 2;
			pointer-events: none;
		}

		/* Faster transition for the 'lock-in' effect */
		.overlay {
			position: absolute;
			inset: 0;
			opacity: 0;
			z-index: 3;
			pointer-events: none;
			border-radius: 28px;
			transition: opacity 0.08s ease-out;
		}

		.overlay-up {
			background: #E24B4A;
		}

		.overlay-left {
			background: #F4C430;
		}

		.card-content {
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			z-index: 4;
			padding: 3rem 1rem 1.5rem;
			background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
			text-align: center;
		}

		.card-question {
			font-size: 16px;
			color: #fff;
			margin-bottom: 8px;
			font-weight: 600;
		}

		.context-area {
			padding: 1.5rem 1rem 2.5rem;
			text-align: center;
			display: flex;
			flex-direction: column;
			justify-content: center;
			transition: opacity 0.3s ease;
		}

		.context-title {
			font-size: 15px;
			color: #7B4F2E;
			font-weight: 600;
			margin-bottom: 4px;
		}

		.context-desc {
			font-size: 13px;
			color: #B07850;
			opacity: 0.8;
		}

		.stamp {
			position: absolute;
			border-radius: 12px;
			padding: 8px 20px;
			font-size: 32px;
			font-weight: 900;
			opacity: 0;
			z-index: 6;
			border: 5px solid;
			pointer-events: none;
			transition: opacity 0.1s;
		}

		.stamp-no {
			border-color: #7B4F2E;
			color: #7B4F2E;
			top: 40px;
			right: 30px;
			transform: rotate(15deg);
		}

		.stamp-yes {
			border-color: #3B6D11;
			color: #3B6D11;
			top: 40px;
			left: 30px;
			transform: rotate(-15deg);
		}
	</style>
</head>

<body>

	<div class="wrap">
		<div class="top-section">
			<div class="topbar">
				<div class="app-name">نكهة</div>
				<div class="streak">🔥 ٣ أيام</div>
			</div>
			<div class="confidence-track">
				<div class="confidence-fill" id="progress"></div>
			</div>
		</div>

		<div class="arena">
			<div class="card" id="card">
				<div class="card-split-wrap">
					<div class="side" id="img-left">🍗</div>
					<div class="card-gradient-mid"></div>
					<div class="side" id="img-right">🥬</div>
				</div>
				<div class="overlay overlay-up" id="over-up"></div>
				<div class="overlay overlay-left" id="over-left"></div>
				<div class="stamp stamp-no" id="stamp-no">لا</div>
				<div class="stamp stamp-yes" id="stamp-yes">آكلها</div>
				<div class="card-content">
					<div class="card-question" id="card-q">...</div>
				</div>
			</div>
		</div>

		<div class="context-area" id="ctx-area">
			<div class="context-title" id="ctx-title">...</div>
			<div class="context-desc" id="ctx-desc">...</div>
		</div>
	</div>

</body>

<script>
	const cards = [
		{ q: 'دجاج + سبانخ؟', left: '🍗', right: '🥬', lBg: '#FF8A65', rBg: '#9CCC65', title: 'تجانس المكونات', desc: 'نقيس مدى قبولك لهذه الإضافات معاً' },
		{ q: 'أرز + طماطم؟', left: '🍚', right: '🍅', lBg: '#FFD54F', rBg: '#EF5350', title: 'أساسيات الوجبة', desc: 'هل تعتبر هذا المزيج وجبة متكاملة؟' },
		{ q: 'لحم + سلطة؟', left: '🍖', right: '🥗', lBg: '#A1887F', rBg: '#DCE775', title: 'وجبة غداء', desc: 'هل تفضل البروتين مع الألياف الخضراء؟' },
	];

	let idx = 0, dragging = false, startX = 0, startY = 0;
	const PHYSICS_THRESHOLD = 100;
	const FLY_THRESHOLD = 140;

	const card = document.getElementById('card');
	const ctxArea = document.getElementById('ctx-area');
	const overUp = document.getElementById('over-up');
	const overLeft = document.getElementById('over-left');
	const stampNo = document.getElementById('stamp-no');
	const stampYes = document.getElementById('stamp-yes');

	function setCard(i) {
		card.style.transition = 'none';
		card.style.transform = 'translate(0,0) rotate(0)';
		card.style.opacity = '1';
		[overUp, overLeft, stampNo, stampYes].forEach(el => {
			el.style.transition = 'none';
			el.style.opacity = 0;
		});

		const c = cards[i % cards.length];
		document.getElementById('img-left').textContent = c.left;
		document.getElementById('img-left').style.background = c.lBg;
		document.getElementById('img-right').textContent = c.right;
		document.getElementById('img-right').style.background = c.rBg;
		document.getElementById('card-q').textContent = c.q;

		ctxArea.style.opacity = 0;
		setTimeout(() => {
			document.getElementById('ctx-title').textContent = c.title;
			document.getElementById('ctx-desc').textContent = c.desc;
			ctxArea.style.opacity = 1;
		}, 150);

		document.getElementById('progress').style.width = ((i % 5 + 1) * 20) + '%';

		requestAnimationFrame(() => {
			[overUp, overLeft, stampNo, stampYes].forEach(el => el.style.transition = 'opacity 0.1s ease-out');
		});
	}

	function calculatePhysics(delta) {
		const sign = delta > 0 ? 1 : -1;
		const absDelta = Math.abs(delta);
		if (absDelta <= PHYSICS_THRESHOLD) return delta * 0.2;
		return (PHYSICS_THRESHOLD * 0.5 * sign) + (delta - (PHYSICS_THRESHOLD * sign)) * 2.0;
	}

	function onMove(e) {
		if (!dragging) return;
		const rx = e.clientX - startX;
		const ry = e.clientY - startY;

		const mx = calculatePhysics(rx);
		const my = calculatePhysics(ry);

		card.style.transform = `translate(${mx}px, ${my}px) rotate(${mx * 0.04}deg)`;

		// Dynamic visual feedback (scaled opacity)
		if (my < -20) overUp.style.opacity = Math.min(0.7, Math.abs(my) / 200);
		else overUp.style.opacity = 0;

		if (mx < -20) {
			overLeft.style.opacity = Math.min(0.6, Math.abs(mx) / 200);
			stampNo.style.opacity = Math.min(1, Math.abs(mx + 20) / 80);
			stampYes.style.opacity = 0;
		} else if (mx > 20) {
			overLeft.style.opacity = 0;
			stampYes.style.opacity = Math.min(1, (mx - 20) / 80);
			stampNo.style.opacity = 0;
		} else {
			[overLeft, stampNo, stampYes].forEach(el => el.style.opacity = 0);
		}
	}

	function fly(dir) {
		// --- COMMIT TO COLOR ---
		// Force 100% opacity for the relevant overlay before the card leaves
		if (dir === 'u') overUp.style.opacity = 1;
		if (dir === 'l') overLeft.style.opacity = 1;
		// Note: Yes (Right) doesn't have an overlay, only a stamp.
		if (dir === 'r') stampYes.style.opacity = 1;
		if (dir === 'l') stampNo.style.opacity = 1;

		card.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s';
		const x = dir === 'r' ? 1000 : (dir === 'l' ? -1000 : 0);
		const y = dir === 'u' ? -1200 : 0;
		card.style.transform = `translate(${x}px, ${y}px) rotate(${x / 10}deg)`;
		card.style.opacity = '0';

		setTimeout(() => { idx++; setCard(idx); }, 400);
	}

	const start = (e) => {
		dragging = true;
		startX = e.clientX; startY = e.clientY;
		card.style.transition = 'none';
	};

	const end = (e) => {
		if (!dragging) return;
		dragging = false;

		const rx = e.clientX - startX;
		const ry = e.clientY - startY;

		if (rx > FLY_THRESHOLD) fly('r');
		else if (rx < -FLY_THRESHOLD) fly('l');
		else if (ry < -FLY_THRESHOLD) fly('u');
		else {
			card.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
			card.style.transform = 'translate(0,0) rotate(0)';
			[overUp, overLeft, stampNo, stampYes].forEach(el => el.style.opacity = 0);
		}
	};

	card.addEventListener('pointerdown', start);
	window.addEventListener('pointermove', onMove);
	window.addEventListener('pointerup', end);

	setCard(0);
</script>
