<!DOCTYPE html>
<html lang="ar">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="wrap">
		<div class="top-section">
			<div class="topbar">
				<div class="app-name">تذوّق</div>
				<div class="streak">🔥 ٣ أيام</div>
			</div>
			<div class="confidence-track">
				<div class="confidence-fill" id="progress"></div>
			</div>
		</div>

		<div class="arena">
			<div id="stack-container"></div>

			<div id="done-screen">
				<div style="font-size: 80px; margin-bottom: 20px;">✅</div>
				<div class="context-title" style="font-size: 22px;">تم الانتهاء!</div>
				<div class="context-desc">لقد تعلمنا ذوقك بشكل رائع</div>
				<button id="btn-reload">ابدأ من جديد</button>
			</div>
		</div>

		<div class="context-area" id="ctx-area">
			<div class="context-title" id="ctx-title">...</div>
			<div class="context-desc" id="ctx-desc">...</div>
		</div>
	</div>

</body>
<script type="module" src="src/main.js"></script>

</html>
